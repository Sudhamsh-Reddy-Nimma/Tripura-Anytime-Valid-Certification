[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amfs_2_0"
version = "0.1.0"
description = "AMFS 2.0: Statistical Reliability and Selection-Induced False Certification in Finite-Shot QAOA Optimization (Stage 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.3",
    "scipy==1.15.2",
    "pandas==2.2.3",
    "matplotlib==3.10.1",
    "seaborn==0.13.2",
    "PyYAML==6.0",
    "tabulate==0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
